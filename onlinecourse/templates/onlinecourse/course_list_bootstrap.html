{% extends 'onlinecourse/base.html' %}
{% block content %}
<h1 class="mb-4">Available Courses</h1>
<div class="row">
    {% for course in course_list %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            {% if course.image %}
            <img src="{{ course.image.url }}" class="card-img-top" alt="{{ course.name }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ course.name }}</h5>
                <p class="card-text">{{ course.description|truncatechars:120 }}</p>
                <a href="{% url 'onlinecourse:course_details' course.id %}" class="btn btn-primary">View Course</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>No courses available yet.</p>
    {% endfor %}
</div>
{% endblock %}
