{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'onlinecourse/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a>
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <span class="text-light me-3">{{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/admin/logout/">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/admin/login/">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <small>Online Course Application — Django Final Project</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
